name: Generate Projects Widget

on:
  push:
    branches:
      - main
    paths:
      - "projects.json"
      - "scripts/render-projects.js"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render projects.svg
        run: node scripts/render-projects.js

      - name: Push to "projects" branch
        run: |
          mkdir -p /tmp/deploy
          cp projects.svg /tmp/deploy/
          cd /tmp/deploy
          git init -q
          git checkout -q -b projects
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects.svg
          git commit -q -m "Update projects.svg"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -q -f origin projects:projects
